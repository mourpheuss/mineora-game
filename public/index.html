<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mineora Sentinel | Giriş & Kayıt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-orange-500 selection:text-white">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
    
    <!-- Logo ve Başlık -->
    <div class="text-center space-y-2">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-orange-500 to-amber-600 flex items-center justify-center text-white text-2xl mx-auto shadow-lg shadow-orange-600/30">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1 class="font-display font-black text-2xl tracking-tight text-white">MINEORA <span class="text-orange-500">SENTINEL</span></h1>
      <p class="text-xs text-slate-400 font-mono">Kurumsal Kripto Anomali & VIP Radar Masası</p>
    </div>

    <!-- Tab Değiştirici -->
    <div class="grid grid-cols-2 gap-2 bg-slate-950 p-1.5 rounded-2xl border border-slate-800 font-mono text-xs">
      <button id="tabLoginBtn" onclick="switchTab('login')" class="py-2.5 rounded-xl font-bold bg-orange-600 text-white transition">Giriş Yap</button>
      <button id="tabRegisterBtn" onclick="switchTab('register')" class="py-2.5 rounded-xl font-bold text-slate-400 hover:text-white transition">Kayıt Ol</button>
    </div>

    <!-- GİRİŞ FORMU -->
    <form id="formLogin" onsubmit="event.preventDefault(); submitLogin();" class="space-y-4 font-mono text-xs">
      <div class="space-y-1.5">
        <label class="text-slate-400 block font-bold">Kullanıcı Adı veya E-posta:</label>
        <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5">
          <i class="fa-solid fa-user text-slate-500 text-sm"></i>
          <input type="text" id="loginUsername" required placeholder="kullanici_adi" class="bg-transparent text-white w-full focus:outline-none" />
        </div>
      </div>

      <div class="space-y-1.5">
        <label class="text-slate-400 block font-bold">Şifre:</label>
        <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5">
          <i class="fa-solid fa-lock text-slate-500 text-sm"></i>
          <input type="password" id="loginPassword" required placeholder="••••••••" class="bg-transparent text-white w-full focus:outline-none" />
        </div>
      </div>

      <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-orange-600/20">
        Panele Giriş Yap
      </button>
    </form>

    <!-- KAYIT FORMU -->
    <form id="formRegister" onsubmit="event.preventDefault(); submitRegister();" class="hidden space-y-4 font-mono text-xs">
      <div class="space-y-1.5">
        <label class="text-slate-400 block font-bold">Kullanıcı Adı:</label>
        <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5">
          <i class="fa-solid fa-user text-slate-500 text-sm"></i>
          <input type="text" id="regUsername" required placeholder="Örn: TraderAli" class="bg-transparent text-white w-full focus:outline-none" />
        </div>
      </div>

      <div class="space-y-1.5">
        <label class="text-slate-400 block font-bold">E-Posta:</label>
        <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5">
          <i class="fa-solid fa-envelope text-slate-500 text-sm"></i>
          <input type="email" id="regEmail" required placeholder="ali@gmail.com" class="bg-transparent text-white w-full focus:outline-none" />
        </div>
      </div>

      <div class="space-y-1.5">
        <label class="text-slate-400 block font-bold">Şifre:</label>
        <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5">
          <i class="fa-solid fa-lock text-slate-500 text-sm"></i>
          <input type="password" id="regPassword" required placeholder="••••••••" class="bg-transparent text-white w-full focus:outline-none" />
        </div>
      </div>

      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-600/20">
        Hesap Oluştur & Abonelik Adımına Geç
      </button>
    </form>

  </div>

  <script>
    // Firebase Konfigürasyonu
    const firebaseConfig = {
      databaseURL: "https://analiz-sepeti-7ea73-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    function switchTab(tab) {
      const formLogin = document.getElementById('formLogin');
      const formRegister = document.getElementById('formRegister');
      const btnLogin = document.getElementById('tabLoginBtn');
      const btnRegister = document.getElementById('tabRegisterBtn');

      if (tab === 'login') {
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
        btnLogin.className = "py-2.5 rounded-xl font-bold bg-orange-600 text-white transition";
        btnRegister.className = "py-2.5 rounded-xl font-bold text-slate-400 hover:text-white transition";
      } else {
        formLogin.classList.add('hidden');
        formRegister.classList.remove('hidden');
        btnRegister.className = "py-2.5 rounded-xl font-bold bg-orange-600 text-white transition";
        btnLogin.className = "py-2.5 rounded-xl font-bold text-slate-400 hover:text-white transition";
      }
    }

    async function submitRegister() {
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();

      if (!username || !email || !password) {
        alert("Lütfen tüm alanları doldurun.");
        return;
      }

      try {
        const userRef = db.ref('users/' + username);
        const snapshot = await userRef.once('value');

        if (snapshot.exists()) {
          alert("Bu kullanıcı adı zaten kullanımda. Lütfen başka bir isim seçin.");
          return;
        }

        // Güvenlik Kuralına Uygun: isVip ZORUNLU false olarak kaydolur
        const newUser = {
          username: username,
          email: email,
          password: password,
          isVip: false,
          status: "PAYMENT_PENDING",
          createdAt: Date.now()
        };

        await userRef.set(newUser);

        // Kullanıcıyı oturuma al ama VIP yapma
        sessionStorage.setItem('currentUser', username);
        sessionStorage.setItem('isVip', 'false');

        alert("Hesabınız oluşturuldu! Radara erişmek için lütfen 500 USDT VIP abonelik ödemesini tamamlayın.");
        
        // ASLA DİREKT RADARA ATMAZ, ÖDEME EKRANINA GÖNDERİR
        window.location.href = 'payment.html';

      } catch (err) {
        console.error("Kayıt hatası:", err);
        alert("Kayıt başarısız: " + err.message);
      }
    }

    async function submitLogin() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      if (!username || !password) {
        alert("Lütfen bilgilerinizi eksiksiz girin.");
        return;
      }

      // Yönetici doğrudan geçiş kontrolü
      if ((username === 'Masterpro' || username === 'eren@gmail.com') && password === '123456') {
        sessionStorage.setItem('currentUser', 'Masterpro');
        sessionStorage.setItem('isVip', 'true');
        sessionStorage.setItem('isAdmin', 'true');
        window.location.href = 'admin.html';
        return;
      }

      try {
        const userRef = db.ref('users/' + username);
        const snapshot = await userRef.once('value');
        const user = snapshot.val();

        if (!user || user.password !== password) {
          alert("Hatalı kullanıcı adı veya şifre!");
          return;
        }

        sessionStorage.setItem('currentUser', user.username);
        sessionStorage.setItem('isVip', user.isVip ? 'true' : 'false');

        // ÖDEME YAPMAMIŞ KULLANICIYI İÇERİ SOKMA
        if (!user.isVip) {
          alert("VIP aboneliğiniz henüz aktif değil. Lütfen ödemenizi yapın veya yöneticinin onaylamasını bekleyin.");
          window.location.href = 'payment.html';
          return;
        }

        // Sadece ödemesi onaylanmış VIP üyeler içeri girebilir
        window.location.href = 'dashboard.html';

      } catch (err) {
        console.error("Giriş hatası:", err);
        alert("Giriş yapılırken hata oluştu: " + err.message);
      }
    }
  </script>
</body>
</html>
