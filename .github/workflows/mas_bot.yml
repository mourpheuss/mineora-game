name: MAS 5-Dakika Otomatik Analiz Motoru

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-analytics:
    runs-on: ubuntu-latest

    steps:
      - name: Proje Kodlarını Çek
        uses: actions/checkout@v3

      - name: Python Ortamını Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Analiz Motorunu Çalıştır ve Firebase'e Aktar
        run: |
          python main.py
