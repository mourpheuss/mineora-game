<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAS // Mine Analiz System - Olasılık ve Spor Analitiği Terminali</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #06090e;
            --bg-surface: #0c121d;
            --bg-card: rgba(16, 24, 38, 0.78);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(0, 245, 155, 0.35);
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --accent-green: #00f59b;
            --accent-green-glow: rgba(0, 245, 155, 0.15);
            --accent-amber: #f59e0b;
            --accent-blue: #38bdf8;
            --accent-red: #f43f5e;
            --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 245, 155, 0.04) 0%, transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.04) 0%, transparent 45%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1.25rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.9rem;
        }

        .brand-badge {
            background: linear-gradient(135deg, #00f59b, #00a86b);
            color: #06090e;
            font-weight: 800;
            font-size: 0.82rem;
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
            letter-spacing: 0.06em;
            box-shadow: 0 0 15px rgba(0, 245, 155, 0.25);
        }

        .brand-title {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-live-stream {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: #ffffff;
            border: none;
            padding: 0.65rem 1.2rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.35);
            transition: all 0.2s ease;
        }

        .btn-live-stream:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
        }

        .btn-live-stream span.live-dot {
            width: 8px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
            animation: pulseDot 1.2s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
        }

        .stats-bar {
            display: flex;
            gap: 1.25rem;
            background: var(--bg-surface);
            padding: 0.65rem 1.2rem;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            font-family: var(--font-mono);
            font-size: 0.82rem;
        }

        .stat-item span {
            color: var(--text-muted);
            margin-right: 0.4rem;
        }

        .stat-item strong {
            color: var(--accent-green);
        }

        /* CONTROLS */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.75rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .filter-group {
            display: flex;
            gap: 0.5rem;
            background: var(--bg-surface);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.55rem 1.1rem;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
        }

        .filter-btn.active {
            color: var(--accent-green);
        }

        /* GRID & CARDS */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--border-hover);
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.45);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.25rem;
        }

        .entropy-tag {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            padding: 0.3rem 0.65rem;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
        }

        .entropy-tag.safe {
            border-color: rgba(0, 245, 155, 0.3);
            color: var(--accent-green);
            background: var(--accent-green-glow);
        }

        .match-teams {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.35;
            letter-spacing: -0.01em;
            margin-bottom: 0.3rem;
        }

        .match-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        /* METRICS */
        .metrics-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 0.9rem;
            margin: 1rem 0;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 0.45rem;
        }

        .prob-bars {
            display: flex;
            height: 7px;
            border-radius: 4px;
            overflow: hidden;
            background: #1e293b;
            margin: 0.8rem 0;
        }

        .prob-bar.home { background: var(--accent-blue); }
        .prob-bar.draw { background: #64748b; }
        .prob-bar.away { background: var(--accent-amber); }

        .prob-legend {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .scores-box {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-family: var(--font-mono);
            font-size: 0.75rem;
        }

        .score-chip {
            background: rgba(255, 255, 255, 0.04);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            color: #94a3b8;
        }

        .score-chip strong { color: var(--text-main); }

        /* VALUE SCENARIOS */
        .value-section {
            margin-top: 1rem;
            border-top: 1px dashed var(--border-subtle);
            padding-top: 1rem;
        }

        .value-badge-title {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent-green);
            margin-bottom: 0.65rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .value-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 245, 155, 0.05);
            border: 1px solid rgba(0, 245, 155, 0.16);
            padding: 0.65rem 0.85rem;
            border-radius: 8px;
            margin-bottom: 0.45rem;
        }

        .value-market { font-weight: 700; font-size: 0.88rem; }
        .value-stats { font-family: var(--font-mono); font-size: 0.78rem; text-align: right; }
        .ev-tag { color: var(--accent-green); font-weight: 700; margin-left: 0.5rem; }

        /* MODAL (CANLI MAÇ YAYINI) */
        .stream-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(4, 7, 12, 0.88);
            backdrop-filter: blur(16px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .stream-modal.active { display: flex; }

        .stream-content {
            background: #0b111a;
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            width: 100%;
            max-width: 900px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
        }

        .stream-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .stream-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .stream-close:hover { color: #ffffff; }

        .player-viewport {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background: #000000;
        }

        .player-viewport iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand">
            <div class="brand-badge">MAS PRO</div>
            <div>
                <h1 class="brand-title">MINE ANALİZ SYSTEM</h1>
                <p class="brand-subtitle">Dixon-Coles Tabanlı Olasılık Simülasyonu ve +EV Terminali</p>
            </div>
        </div>

        <div class="header-actions">
            <!-- CANLI MAÇ TV BUTONU -->
            <button class="btn-live-stream" onclick="openStreamModal()">
                <span class="live-dot"></span>
                <i class="fa-solid fa-tv"></i> CANLI MAÇ TV
            </button>

            <div class="stats-bar">
                <div class="stat-item"><span>ÇEKİRDEK:</span> <strong>MAS v1.0</strong></div>
                <div class="stat-item"><span>AKTİF EV:</span> <strong id="stat-ev-count">Yükleniyor...</strong></div>
            </div>
        </div>
    </header>

    <div class="controls">
        <div class="filter-group">
            <button class="filter-btn active" onclick="filterCards('all', event)">Tüm Bülten</button>
            <button class="filter-btn" onclick="filterCards('ev', event)">Sadece +EV Fırsatları</button>
        </div>
        <div style="font-size: 0.8rem; color: var(--text-muted); font-family: var(--font-mono);">
            Terminal Durumu: <span id="sync-status" style="color: var(--accent-green);">Bağlantı Kuruluyor...</span>
        </div>
    </div>

    <div class="grid" id="matches-grid">
        <!-- Maçlar dökülecek -->
    </div>
</div>

<!-- CANLI YAYIN MODAL PENCERESİ -->
<div class="stream-modal" id="streamModal" onclick="closeStreamModalOnBackdrop(event)">
    <div class="stream-content" onclick="event.stopPropagation()">
        <div class="stream-header">
            <div style="display: flex; align-items: center; gap: 0.6rem;">
                <span style="color: var(--accent-red); font-size: 0.8rem;"><i class="fa-solid fa-circle animate-pulse"></i> CANLI YAYIN</span>
                <strong style="font-size: 0.95rem; letter-spacing: -0.01em;">MAS Canlı Maç Terminali</strong>
            </div>
            <button class="stream-close" onclick="closeStreamModal()">&times;</button>
        </div>

        <div class="player-viewport">
            <!-- Varsayılan yayın iframe alanı (Kendi yayın linkinizi buraya koyabilirsiniz) -->
            <iframe id="liveFrame" src="https://www.youtube.com/embed/live_stream?channel=UC4R8DWoMoI7CAwX8_BQQ5vg" allowfullscreen allow="autoplay"></iframe>
        </div>

        <div style="padding: 1rem 1.5rem; background: #0c121d; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
            <span style="font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono);">Yayın Kaynağı: Kesintisiz HD Feed</span>
            <div style="display: flex; gap: 0.5rem;">
                <button onclick="changeChannel('https://www.youtube.com/embed/live_stream?channel=UC4R8DWoMoI7CAwX8_BQQ5vg')" style="background: rgba(255,255,255,0.06); border: 1px solid var(--border-subtle); color: var(--text-main); padding: 0.35rem 0.75rem; border-radius: 6px; font-size: 0.75rem; cursor: pointer;">Kanal 1</button>
                <button onclick="changeChannel('about:blank')" style="background: rgba(255,255,255,0.06); border: 1px solid var(--border-subtle); color: var(--text-main); padding: 0.35rem 0.75rem; border-radius: 6px; font-size: 0.75rem; cursor: pointer;">Kanal 2</button>
            </div>
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    // State.js'ten gelen mevcut Firebase ayarın otomatik bağlandı
    const firebaseConfig = {
        databaseURL: "https://mineora-web-default-rtdb.firebaseio.com"
    };

    const defaultData = [
        {
            "match_id": "50142",
            "date": "2026-10-07 20:45",
            "match": "Manchester City vs Arsenal",
            "expected_goals": { "home": 2.15, "away": 1.10 },
            "probabilities": { "home_win": 54.2, "draw": 23.5, "away_win": 22.3, "over_25": 62.4, "under_25": 37.6, "btts_yes": 58.0 },
            "top_predicted_scores": [
                { "score": "2-1", "prob": "%11.8" },
                { "score": "2-0", "prob": "%10.4" },
                { "score": "1-1", "prob": "%9.6" }
            ],
            "entropy": 1.41,
            "status": "ONAYLANDI (Stabil)",
            "value_scenarios": [
                { "market": "2.5 ÜST", "model_prob": "%62.4", "bulten_orani": 1.70, "expected_value": "+%6.1" },
                { "market": "MS 1", "model_prob": "%54.2", "bulten_orani": 1.95, "expected_value": "+%5.7" }
            ]
        },
        {
            "match_id": "50143",
            "date": "2026-10-07 21:00",
            "match": "Galatasaray vs Fenerbahçe",
            "expected_goals": { "home": 1.75, "away": 1.55 },
            "probabilities": { "home_win": 39.5, "draw": 27.8, "away_win": 32.7, "over_25": 56.1, "under_25": 43.9, "btts_yes": 61.2 },
            "top_predicted_scores": [
                { "score": "1-1", "prob": "%12.2" },
                { "score": "2-1", "prob": "%9.8" },
                { "score": "1-2", "prob": "%8.9" }
            ],
            "entropy": 1.48,
            "status": "ONAYLANDI (Stabil)",
            "value_scenarios": [
                { "market": "MS 2", "model_prob": "%32.7", "bulten_orani": 3.40, "expected_value": "+%11.2" }
            ]
        }
    ];

    let currentMatches = [];

    function initApp() {
        const statusElement = document.getElementById('sync-status');

        try {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();

            statusElement.textContent = "Canlı Bulut Senkronu Aktif";
            statusElement.style.color = "var(--accent-green)";

            db.ref("analyzed_matches").on("value", (snapshot) => {
                const data = snapshot.val();
                if (data && data.length > 0) {
                    currentMatches = data;
                    renderCards(currentMatches);
                } else {
                    loadLocalOrFallback();
                }
            }, (error) => {
                loadLocalOrFallback();
            });
        } catch (err) {
            loadLocalOrFallback();
        }
    }

    async function loadLocalOrFallback() {
        try {
            const res = await fetch('analiz_raporu.json');
            if (res.ok) {
                const data = await res.json();
                if (data && data.length > 0) {
                    currentMatches = data;
                    renderCards(currentMatches);
                    return;
                }
            }
        } catch (e) {}
        
        currentMatches = defaultData;
        renderCards(currentMatches);
    }

    function renderCards(matches) {
        const grid = document.getElementById('matches-grid');
        grid.innerHTML = '';

        let totalEVCount = 0;

        matches.forEach(m => {
            const hasEV = m.value_scenarios && m.value_scenarios.length > 0;
            if (hasEV) totalEVCount++;

            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('data-has-ev', hasEV ? 'true' : 'false');

            let valuesHtml = '';
            if (hasEV) {
                valuesHtml = `
                    <div class="value-section">
                        <div class="value-badge-title">
                            <span>●</span> Pozitif Beklenen Değer (+EV)
                        </div>
                        ${m.value_scenarios.map(v => `
                            <div class="value-item">
                                <span class="value-market">${v.market}</span>
                                <div class="value-stats">
                                    <span>Oran: ${v.bulten_orani}</span>
                                    <span class="ev-tag">${v.expected_value}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            let topScoresHtml = '';
            if (m.top_predicted_scores && m.top_predicted_scores.length > 0) {
                topScoresHtml = `
                    <div class="scores-box">
                        <span style="color: var(--text-muted);">En Olası Skorlar:</span>
                        ${m.top_predicted_scores.map(s => `
                            <span class="score-chip"><strong>${s.score}</strong> (${s.prob})</span>
                        `).join('')}
                    </div>
                `;
            }

            card.innerHTML = `
                <div>
                    <div class="card-header">
                        <div>
                            <h2 class="match-teams">${m.match}</h2>
                            <span class="match-meta">ID: ${m.match_id || '---'} • ${m.date || 'Tarih Belirtilmedi'}</span>
                        </div>
                        <span class="entropy-tag safe">Entropi: ${m.entropy}</span>
                    </div>

                    <div class="metrics-box">
                        <div class="metric-row">
                            <span style="color: var(--text-muted);">Dinamik Beklenti (xG)</span>
                            <span style="font-family: var(--font-mono);">${m.expected_goals ? `${m.expected_goals.home} -${m.expected_goals.away}` : '-'}</span>
                        </div>
                        <div class="metric-row">
                            <span style="color: var(--text-muted);">2.5 Üst Olasılığı</span>
                            <span style="font-family: var(--font-mono); color: var(--accent-blue);">%${m.probabilities ? m.probabilities.over_25 : '-'}</span>
                        </div>

                        <div class="prob-bars">
                            <div class="prob-bar home" style="width: ${m.probabilities ? m.probabilities.home_win : 33}%"></div>
                            <div class="prob-bar draw" style="width: ${m.probabilities ? m.probabilities.draw : 33}%"></div>
                            <div class="prob-bar away" style="width: ${m.probabilities ? m.probabilities.away_win : 33}%"></div>
                        </div>

                        <div class="prob-legend">
                            <span>MS 1: %${m.probabilities ? m.probabilities.home_win : '-'}</span>
                            <span>X: %${m.probabilities ? m.probabilities.draw : '-'}</span>
                            <span>MS 2: %${m.probabilities ? m.probabilities.away_win : '-'}</span>
                        </div>

                        ${topScoresHtml}
                    </div>
                </div>

                ${valuesHtml}
            `;

            grid.appendChild(card);
        });

        document.getElementById('stat-ev-count').textContent = `${totalEVCount} Karşılaşma`;
    }

    function filterCards(type, e) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        if (e && e.target) e.target.classList.add('active');

        const cards = document.querySelectorAll('.card');
        cards.forEach(c => {
            if (type === 'all') c.style.display = 'flex';
            else if (type === 'ev') c.style.display = c.getAttribute('data-has-ev') === 'true' ? 'flex' : 'none';
        });
    }

    // Modal Fonksiyonları
    function openStreamModal() {
        document.getElementById('streamModal').classList.add('active');
    }

    function closeStreamModal() {
        document.getElementById('streamModal').classList.remove('active');
    }

    function closeStreamModalOnBackdrop(e) {
        if (e.target.id === 'streamModal') closeStreamModal();
    }

    function changeChannel(url) {
        document.getElementById('liveFrame').src = url;
    }

    initApp();
</script>
</body>
</html>
